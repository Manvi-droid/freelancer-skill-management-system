version: '3.8'

services:
  fsms-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fsms-freelancer-platform
    restart: unless-stopped
    ports:
      - "80:5000"       # Standard HTTP for public AWS web traffic
      - "5000:5000"     # Direct port
    environment:
      - NODE_ENV=production
      - PORT=5000
      - JWT_SECRET=aws_free_tier_fsms_super_secure_key_2026
      # Optional AWS S3 Integration (Uncomment when deploying to AWS)
      # - AWS_REGION=us-east-1
      # - AWS_ACCESS_KEY_ID=your_access_key
      # - AWS_SECRET_ACCESS_KEY=your_secret_key
      # - AWS_S3_BUCKET=your-fsms-evidence-bucket
    volumes:
      # Persistent SQLite storage on EC2 EBS volume (Zero database hosting costs!)
      - fsms_db_data:/app/data
      # Persistent file uploads
      - fsms_uploads_data:/app/uploads
    # Memory limits strictly engineered for AWS EC2 t2.micro (1024MB total host RAM)
    deploy:
      resources:
        limits:
          memory: 450M
        reservations:
          memory: 120M

volumes:
  fsms_db_data:
    driver: local
  fsms_uploads_data:
    driver: local
